version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: soundtracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbmsuser
      POSTGRES_PASSWORD: 191688
      POSTGRES_DB: movieservicebd
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - soundtracker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmsuser"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: soundtracker-backend:offline
    container_name: soundtracker_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mock
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/movieservicebd
      SPRING_DATASOURCE_USERNAME: dbmsuser
      SPRING_DATASOURCE_PASSWORD: 191688
    ports:
      - "8080:8080"
    networks:
      - soundtracker-net

volumes:
  db_data:

networks:
  soundtracker-net:
    driver: bridge
