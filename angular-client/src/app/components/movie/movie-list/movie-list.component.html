<div class="container mt-3">
  <!-- Search by movie title -->
  <input [(ngModel)]="searchTerm" placeholder="Search by movie title" class="form-control mb-3">
  <div class="grid">
    <div class="card" *ngFor="let movie of filteredMovies">
      <a [routerLink]="['/movies', movie.id]">
        <img class="card-img" [src]="movie.poster" alt="Movie poster">
        <div class="card-body">
          <!-- Display Russian title; if an English title field (enTitle) is later added, it can be appended -->
          <h5 class="card-title">{{movie.ruTitle}}</h5>
          <p class="card-text"><small class="text-muted">{{movie.releaseYear}}</small></p>
          <p class="card-text">{{movie.length}} min</p>
          <p class="card-text">Genres: {{movie.genres.join(', ')}}</p>
        </div>
      </a>
    </div>
  </div>
</div>
